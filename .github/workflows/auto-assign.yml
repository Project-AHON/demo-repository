---
name: Auto Assign PR

on:
  pull_request:
    types: [opened]

permissions:
  contents: write
  pull-requests: write

env:
  PR_REVIEWERS: ${{ vars.PR_REVIEWERS }}

jobs:
  assign:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assign next team member
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const members = process.env.PR_REVIEWERS
              .split(',')
              .map(member => member.trim());

            const stateFile = '.github/assignee-state.txt';

            let index = Number(
              fs.readFileSync(stateFile, 'utf8').trim()
            );

            if (index < 0 || index >= members.length) {
              index = 0;
            }

            const assignee = members[index];

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              assignees: [assignee]
            });

            console.log(`Assigned PR to ${assignee}`);

            const nextIndex = (index + 1) % members.length;

            fs.writeFileSync(
              stateFile,
              `${nextIndex}\n`
            );

      - name: Save rotation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/assignee-state.txt
          git commit -m "chore: update PR assignment rotation" || exit 0
          git push